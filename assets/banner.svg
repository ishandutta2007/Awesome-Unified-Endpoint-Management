<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-14px) translateX(8px); }
    }
    @keyframes floatOrbRev {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(12px) translateX(-10px); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    .floating-orb1 { animation: floatOrb 7s ease-in-out infinite; transform-origin: center; }
    .floating-orb2 { animation: floatOrbRev 9s ease-in-out infinite; transform-origin: center; }
    .pulse-layer { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .dash-line { stroke-dasharray: 6, 6; animation: dashCycle 4s linear infinite; }
    .dash-line-rev { stroke-dasharray: 6, 6; animation: dashCycle 6s linear infinite reverse; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern -->
  <g opacity="0.15">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle class="floating-orb1" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.09" filter="url(#glow)" />
  <circle class="floating-orb2" cx="1020" cy="240" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)" />
  <circle class="floating-orb1" cx="600" cy="180" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Network Interconnection / Mesh Lines representing UEM Endpoints -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5">
    <path class="dash-line" d="M 600,75 L 420,130" />
    <path class="dash-line-rev" d="M 600,75 L 780,130" />
    <path class="dash-line" d="M 420,130 L 280,210" />
    <path class="dash-line-rev" d="M 780,130 L 920,210" />
    <path class="dash-line" d="M 280,210 L 390,290" />
    <path class="dash-line-rev" d="M 920,210 L 810,290" />
    <path class="dash-line" d="M 390,290 L 600,305" />
    <path class="dash-line-rev" d="M 810,290 L 600,305" />
    <path class="dash-line" d="M 600,75 L 600,305" stroke-opacity="0.3" />
  </g>

  <!-- Network Endpoint Nodes -->
  <g fill="#38bdf8">
    <circle cx="600" cy="75" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="420" cy="130" r="5" fill="#818cf8" filter="url(#softGlow)" />
    <circle cx="280" cy="210" r="6" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="390" cy="290" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="780" cy="130" r="5" fill="#c084fc" filter="url(#softGlow)" />
    <circle cx="920" cy="210" r="6" fill="#f43f5e" filter="url(#softGlow)" />
    <circle cx="810" cy="290" r="5" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="600" cy="305" r="5" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- Dynamic Pulsing Rings -->
  <g class="pulse-layer" stroke="#38bdf8" fill="none" stroke-width="1.5">
    <circle cx="280" cy="210" r="14" opacity="0.6" />
    <circle cx="920" cy="210" r="14" opacity="0.6" stroke="#f43f5e" />
    <circle cx="600" cy="75" r="16" opacity="0.6" />
  </g>

  <!-- Central Card -->
  <g filter="url(#glow)" opacity="0.25">
    <rect x="200" y="65" width="800" height="210" rx="20" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="2" />
  </g>
  <rect x="200" y="65" width="800" height="210" rx="20" fill="#0b1120" fill-opacity="0.88" stroke="url(#primaryGrad)" stroke-width="1.8" />

  <!-- Badge Pill Tag -->
  <g>
    <rect x="460" y="85" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="600" y="104" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      ✨ CURATED UEM ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#softGlow)">
    AWESOME UNIFIED ENDPOINT MANAGEMENT
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.3" text-anchor="middle">
    Enterprise SaaS Platforms • Open-Source MDM &amp; UEM • Cross-Platform Security
  </text>

  <!-- Platform Tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    <rect x="245" y="220" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="297" y="238">🪟 Windows</text>
    <rect x="360" y="220" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="417" y="238">🍎 macOS &amp; iOS</text>
    <rect x="485" y="220" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="532" y="238">🐧 Linux</text>
    <rect x="590" y="220" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="640" y="238">🤖 Android</text>
    <rect x="700" y="220" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="762" y="238">⚡ ChromeOS &amp; IoT</text>
    <rect x="835" y="220" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="892" y="238">🛡️ MDM &amp; EDR</text>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
